name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test (race detector)
        run: make test
      - name: Fuzz (10 s per target)
        run: make fuzz FUZZTIME=10s
      - uses: astral-sh/setup-uv@v5
      - name: Validate WARC output with warcio
        run: make warc-check
      - name: Demo
        run: make demo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
